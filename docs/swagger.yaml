basePath: /api/v1
definitions:
  menu.MenuTreeResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/menu.MenuTreeResponse'
        type: array
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      sort_order:
        type: integer
    type: object
  role.RoleCreateRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      parent_id:
        type: integer
    required:
    - name
    type: object
  role.RolePermissionRequest:
    properties:
      permission_id:
        type: integer
    required:
    - permission_id
    type: object
  role.RoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      updated_at:
        type: string
    type: object
  role.RoleUpdateRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
      parent_id:
        type: integer
    type: object
  service_account.CreateServiceAccountRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  service_account.CreateServiceAccountResponse:
    properties:
      api_key:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      revoked:
        type: boolean
    type: object
  service_account.ServiceAccountResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      revoked:
        type: boolean
    type: object
  user.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  user.UserRoleRequest:
    properties:
      role_id:
        type: integer
    required:
    - role_id
    type: object
  utils.APIResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Advanced RBAC and Authentication Service with Audit Logs.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Auth Service API
  version: "1.0"
paths:
  /audit-logs:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of audit logs with optional filtering
      parameters:
      - description: User ID filter
        in: query
        name: user_id
        type: integer
      - description: Action filter (CREATE, UPDATE, DELETE)
        in: query
        name: action
        type: string
      - description: Pagination limit
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: List audit logs
      tags:
      - audit
  /menus/allowed:
    get:
      description: Get hierarchical menu structure accessible by the current user
        based on their permissions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/menu.MenuTreeResponse'
                  type: array
              type: object
      summary: Get allowed menus
      tags:
      - menus
  /menus/tree:
    get:
      description: Get full hierarchical menu structure for all menus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/menu.MenuTreeResponse'
                  type: array
              type: object
      summary: Get full menu tree
      tags:
      - menus
  /permissions/grouped:
    get:
      description: Get all permissions grouped by their module prefix (e.g. users,
        roles)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    items:
                      type: string
                    type: array
                  type: object
              type: object
      summary: Get grouped permissions
      tags:
      - permissions
  /rbac/debug/user/{id}:
    get:
      description: Get direct roles, inherited roles, and all effective permissions
        for a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Debug user RBAC
      tags:
      - rbac
  /roles:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all roles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/role.RoleResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: List roles
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: Create a new role with optional hierarchy
      parameters:
      - description: Role details
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/role.RoleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/role.RoleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: Create a new role
      tags:
      - roles
  /roles/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-delete a role by ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: Delete role
      tags:
      - roles
    get:
      consumes:
      - application/json
      description: Retrieve a specific role by its unique ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/role.RoleResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: Get role by ID
      tags:
      - roles
    put:
      consumes:
      - application/json
      description: Update role details, including parent/hierarchy
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated role details
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/role.RoleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/role.RoleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: Update role
      tags:
      - roles
  /roles/{id}/permissions:
    get:
      description: Get all permissions assigned directly to a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
      summary: List role permissions
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: Assign a specific permission to a role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission assignment request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/role.RolePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Assign permission to role
      tags:
      - roles
  /roles/{id}/permissions/{permissionId}:
    delete:
      consumes:
      - application/json
      description: Remove a specific permission from a role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission ID
        in: path
        name: permissionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Remove permission from role
      tags:
      - roles
  /roles/{id}/users:
    get:
      description: Get all users assigned to a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
      summary: List role users
      tags:
      - roles
  /service-accounts:
    get:
      description: Retrieve all service accounts (api_key is never returned)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service_account.ServiceAccountResponse'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: List all service accounts
      tags:
      - service-accounts
    post:
      consumes:
      - application/json
      description: Create a new service account and return its API key (returned only
        once)
      parameters:
      - description: Service account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service_account.CreateServiceAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/service_account.CreateServiceAccountResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: Create a service account
      tags:
      - service-accounts
  /service-accounts/{id}/revoke:
    post:
      description: Mark a service account as revoked. All future authentication attempts
        will be rejected.
      parameters:
      - description: Service Account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - Bearer: []
      summary: Revoke a service account
      tags:
      - service-accounts
  /users/{id}/permissions:
    get:
      description: Get all permissions assigned to a user including those inherited
        via role hierarchy
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      summary: Get user effective permissions
      tags:
      - users
  /users/{id}/roles:
    get:
      description: Get all roles assigned to a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/user.RoleResponse'
                  type: array
              type: object
      summary: List user roles
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Assign a specific role to a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role assignment request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Assign role to user
      tags:
      - users
  /users/{id}/roles/{roleId}:
    delete:
      consumes:
      - application/json
      description: Remove a specific role from a user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role ID
        in: path
        name: roleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Remove role from user
      tags:
      - users
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
