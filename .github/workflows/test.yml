name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.25"
  JWT_SECRET: "test_jwt_secret_must_be_at_least_32_characters_long1234"

jobs:
  # Job 1: Lint and Format checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: cd auth-service && go vet ./...

      - name: Run gofmt check
        run: |
          cd auth-service
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "gofmt check failed: the following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

  # Job 2: Unit and Handler Tests with Coverage
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: cd auth-service && go mod download

      - name: Run unit tests with coverage
        run: |
          cd auth-service
          go test ./internal/... -v -race -coverprofile=coverage.out

      - name: Generate coverage report
        run: |
          cd auth-service
          go tool cover -func=coverage.out
          
          # Calculate coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "## Test Coverage: ${COVERAGE}" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./auth-service/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: auth-service/coverage.out
          retention-days: 30

  # Job 3: End-to-End Tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: cd auth-service && go mod download

      - name: Run E2E tests
        run: |
          cd auth-service
          go test ./tests/e2e/... -v -timeout 120s
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          ENVIRONMENT: development

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: auth-service/test-results/
          retention-days: 7

  # Job 4: Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt=json -out=${GITHUB_WORKSPACE}/gosec-results.json ./auth-service/...'
        continue-on-error: true

      - name: Upload gosec results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gosec-results
          path: gosec-results.json
          retention-days: 7

  # Final Job: Status Check
  status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, security]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" || "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi
